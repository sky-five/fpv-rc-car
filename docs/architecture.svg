<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2cc0c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#36d399"/>
    </marker>
    <marker id="ah-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38d0ff"/>
    </marker>
    <marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8aa0ab"/>
    </marker>
  </defs>

  <style>
    .bg    { fill:#0a0e11; }
    .zone  { fill:none; stroke:rgba(255,255,255,.10); stroke-width:1; stroke-dasharray:4 5; rx:14; }
    .zlbl  { fill:#8aa0ab; font-size:11px; letter-spacing:2px; }
    .box   { fill:#0f171c; stroke:rgba(255,255,255,.18); stroke-width:1.2; }
    .btitle{ fill:#eaf2f6; font-size:13.5px; font-weight:600; }
    .bsub  { fill:#8aa0ab; font-size:10.5px; }
    .title { fill:#f2cc0c; font-size:18px; font-weight:700; }
    .edge-amber { stroke:#f2cc0c; stroke-width:2; fill:none; }
    .edge-green { stroke:#36d399; stroke-width:2; fill:none; }
    .edge-cyan  { stroke:#38d0ff; stroke-width:3; fill:none; }
    .edge-mute  { stroke:#8aa0ab; stroke-width:1.6; fill:none; }
    .edge-dash  { stroke:#38d0ff; stroke-width:1.6; fill:none; stroke-dasharray:6 5; opacity:.8; }
    .elbl  { fill:#cdd8de; font-size:10.5px; }
    .elblbg{ fill:#0a0e11; opacity:.85; }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="540" rx="16"/>
  <text class="title" x="28" y="38">FPV RC Car — data flow</text>

  <!-- zones -->
  <rect class="zone" x="24"  y="200" width="150" height="120" rx="14"/>
  <text class="zlbl" x="30"  y="194">SIM RIG</text>
  <rect class="zone" x="200" y="70"  width="400" height="410" rx="14"/>
  <text class="zlbl" x="206" y="64">LAPTOP (WINDOWS)</text>
  <rect class="zone" x="660" y="70"  width="255" height="410" rx="14"/>
  <text class="zlbl" x="666" y="64">CAR</text>

  <!-- ===== edges (drawn before boxes so boxes sit on top of line ends) ===== -->
  <!-- A: G29 -> reader (USB) -->
  <path class="edge-mute" marker-end="url(#ah-mute)" d="M158 250 L226 233"/>
  <!-- B: reader -> ESP32 control -->
  <path class="edge-amber" marker-end="url(#ah-amber)" d="M392 224 L684 262"/>
  <!-- C: ESP32 -> reader telemetry -->
  <path class="edge-green" marker-end="url(#ah-green)" d="M686 300 L394 250"/>
  <!-- D: reader -> stream_server forward -->
  <path class="edge-green" marker-end="url(#ah-green)" d="M310 266 L310 338"/>
  <!-- E: stream_server -> viewer HUD -->
  <path class="edge-green" marker-end="url(#ah-green)" d="M392 352 L470 336"/>
  <!-- F: phone -> viewer video -->
  <path class="edge-cyan" marker-end="url(#ah-cyan)" d="M686 150 L580 286"/>
  <!-- G: signaling arc phone <-> server -->
  <path class="edge-dash" marker-end="url(#ah-cyan)" d="M686 168 Q540 430 360 374"/>
  <!-- H: ESP32 -> servo/esc -->
  <path class="edge-amber" marker-end="url(#ah-amber)" d="M774 314 L774 378"/>

  <!-- ===== boxes ===== -->
  <!-- G29 -->
  <rect class="box" x="40"  y="228" width="118" height="64" rx="12"/>
  <text class="btitle" x="99" y="254" text-anchor="middle">G29</text>
  <text class="bsub"   x="99" y="272" text-anchor="middle">wheel · pedals · HB</text>

  <!-- g29_reader -->
  <rect class="box" x="228" y="200" width="164" height="66" rx="12"/>
  <text class="btitle" x="310" y="227" text-anchor="middle">g29_reader.py</text>
  <text class="bsub"   x="310" y="245" text-anchor="middle">control + telemetry</text>

  <!-- stream_server -->
  <rect class="box" x="228" y="338" width="164" height="66" rx="12"/>
  <text class="btitle" x="310" y="365" text-anchor="middle">stream_server.py</text>
  <text class="bsub"   x="310" y="383" text-anchor="middle">HTTPS · WebRTC · WS</text>

  <!-- viewer -->
  <rect class="box" x="418" y="270" width="160" height="66" rx="12"/>
  <text class="btitle" x="498" y="297" text-anchor="middle">viewer.html</text>
  <text class="bsub"   x="498" y="315" text-anchor="middle">cockpit + HUD</text>

  <!-- phone -->
  <rect class="box" x="686" y="110" width="176" height="64" rx="12"/>
  <text class="btitle" x="774" y="136" text-anchor="middle">Phone (Chrome)</text>
  <text class="bsub"   x="774" y="154" text-anchor="middle">/phone — camera</text>

  <!-- esp32 -->
  <rect class="box" x="686" y="250" width="176" height="64" rx="12"/>
  <text class="btitle" x="774" y="276" text-anchor="middle">ESP32</text>
  <text class="bsub"   x="774" y="294" text-anchor="middle">in the car</text>

  <!-- actuators -->
  <rect class="box" x="686" y="378" width="176" height="64" rx="12"/>
  <text class="btitle" x="774" y="404" text-anchor="middle">steering servo</text>
  <text class="bsub"   x="774" y="422" text-anchor="middle">+ ESC (throttle)</text>

  <!-- ===== edge labels ===== -->
  <g>
    <rect class="elblbg" x="170" y="226" width="34"  height="15" rx="3"/>
    <text class="elbl"  x="187" y="237" text-anchor="middle">USB</text>

    <rect class="elblbg" x="436" y="214" width="196" height="15" rx="3"/>
    <text class="elbl"  x="534" y="225" text-anchor="middle">UDP :4210 · control 50 Hz</text>

    <rect class="elblbg" x="470" y="276" width="118" height="15" rx="3"/>
    <text class="elbl"  x="529" y="287" text-anchor="middle">UDP telemetry</text>

    <rect class="elblbg" x="318" y="296" width="104" height="15" rx="3"/>
    <text class="elbl"  x="370" y="307" text-anchor="middle">forward :5055</text>

    <rect class="elblbg" x="404" y="320" width="74"  height="15" rx="3"/>
    <text class="elbl"  x="441" y="331" text-anchor="middle">HUD (WS)</text>

    <rect class="elblbg" x="588" y="196" width="150" height="15" rx="3"/>
    <text class="elbl"  x="663" y="207" text-anchor="middle">WebRTC video (P2P)</text>

    <rect class="elblbg" x="452" y="426" width="170" height="15" rx="3"/>
    <text class="elbl"  x="537" y="437" text-anchor="middle">signaling + gear (WS)</text>

    <rect class="elblbg" x="784" y="340" width="40"  height="15" rx="3"/>
    <text class="elbl"  x="804" y="351" text-anchor="middle">PWM</text>
  </g>

  <!-- ===== legend ===== -->
  <g transform="translate(28,500)">
    <line class="edge-amber" x1="0"   y1="0" x2="26" y2="0"/>
    <text class="elbl" x="32"  y="4">control / actuation</text>
    <line class="edge-green" x1="190" y1="0" x2="216" y2="0"/>
    <text class="elbl" x="222" y="4">telemetry</text>
    <line class="edge-cyan"  x1="330" y1="0" x2="356" y2="0"/>
    <text class="elbl" x="362" y="4">video</text>
    <line class="edge-dash"  x1="430" y1="0" x2="456" y2="0"/>
    <text class="elbl" x="462" y="4">WebRTC signaling</text>
  </g>
</svg>
